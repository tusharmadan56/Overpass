# Gateway configuration. Everything the gateway does is driven from this file
# so behaviour changes never require a code change or redeploy of logic.


gateway:
  port: 8080
  # How long we wait on an upstream before giving up. A slow backend must not
  # be allowed to tie up gateway resources indefinitely.
  upstreamTimeoutMs: 10000
  # round-robin | least-connections
  strategy: round-robin

healthCheck:
  intervalMs: 2000
  timeoutMs: 1000
  # consecutive failures before a backend is taken out of rotation
  unhealthyThreshold: 2
  # consecutive successes before it's allowed back in
  healthyThreshold: 2

rateLimit:
  # fixed-window | sliding-log | sliding-window-counter | token-bucket
  algorithm: token-bucket
  # used by token-bucket
  capacity: 5
  refillRatePerSec: 1
  # used by fixed-window / sliding-log / sliding-window-counter
  limit: 5
  windowMs: 5000

backends:
  - id: backend-1
    url: http://localhost:9001
  - id: backend-2
    url: http://localhost:9002
  - id: backend-3
    url: http://localhost:9003
